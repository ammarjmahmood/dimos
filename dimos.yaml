# What dimOS Desktop reads to install and run this version of dimos (fetched over HTTP per tag, no git needed).
name: dimos
version: "0.0.14"
requires:
  dimos-desktop: ">=0.2 <0.3"
  dimcode: ">=0.1 <0.2"
# env: REF (this tag/branch), COMMIT (its commit), DIMOS_DIR (checkout to create), NON_INTERACTIVE=1 when no one can answer prompts
install: |
  set -euo pipefail
  script="$(mktemp)"
  # GitHub's API, not raw.githubusercontent.com: a branch's raw files stay cached for minutes after a push
  curl -fsSL -H "Accept: application/vnd.github.raw" \
    "https://api.github.com/repos/dimensionalOS/dimos/contents/scripts/install.sh?ref=${COMMIT:-$REF}" -o "$script"
  bash "$script" --mode dev --branch "$REF" --project-dir "$DIMOS_DIR" --skip-tests ${NON_INTERACTIVE:+--non-interactive}
  "$DIMOS_DIR/.venv/bin/python" -c "import dimos" && echo "dimos is installed in $DIMOS_DIR"
# The dimos server (blueprints, runs, logs, global config at /dimos/). For now Desktop ships it; it moves here later.
# env: DESKTOP_BIN, DIMOS_DIR, DIMOS_SERVER_SOCKET
start: |
  "$DESKTOP_BIN" dimos-server --detach --dimos-dir "$DIMOS_DIR" --socket "$DIMOS_SERVER_SOCKET"
socket: |
  echo "$DIMOS_SERVER_SOCKET"
