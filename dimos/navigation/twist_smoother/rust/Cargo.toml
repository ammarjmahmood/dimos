[package]
name = "dimos-twist-smoother"
version = "0.1.0"
edition = "2021"
description = "Twist smoothing: low-pass plus acceleration limits on a fixed clock"
license = "Apache-2.0"

[[bin]]
name = "twist_smoother"
path = "src/main.rs"

[dependencies]
dimos-module = { path = "../../../../native/rust/dimos-module" }
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Own Cargo.lock, like the trajectory follower's.
[workspace]
