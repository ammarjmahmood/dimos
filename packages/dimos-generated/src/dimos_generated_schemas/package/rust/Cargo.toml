[package]
name = "dimos-generated-messages"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native CDR messages generated from ROS2 definitions"
include = ["src/*.rs", "schemas.json", "schemas/**", "Cargo.toml"]
[workspace]
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "=0.5.1"
re_cdr = "=0.1.0"
